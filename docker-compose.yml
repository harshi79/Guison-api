services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: binapi
      POSTGRES_USER: binapi
      POSTGRES_PASSWORD: binapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binapi -d binapi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://binapi:binapi@postgres:5432/binapi?sslmode=disable
      DATA_ADMIN_PASSWORD: ${DATA_ADMIN_PASSWORD:?set DATA_ADMIN_PASSWORD in .env}
      HTTP_ADDR: :8080
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_ON_START: ${SYNC_ON_START:-true}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-5m}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SOURCES_JSON: ${SOURCES_JSON:-}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-104857600}
      MAX_INVALID_RATIO: ${MAX_INVALID_RATIO:-0.05}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      TELEGRAM_CHANNEL_URL: ${TELEGRAM_CHANNEL_URL:-}
      TELEGRAM_PRIVATE_URL: ${TELEGRAM_PRIVATE_URL:-}
      DEVELOPER_TELEGRAM_URL: ${DEVELOPER_TELEGRAM_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
