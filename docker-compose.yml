services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: binapi
      POSTGRES_USER: binapi
      POSTGRES_PASSWORD: binapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binapi -d binapi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://binapi:binapi@postgres:5432/binapi?sslmode=disable
      HTTP_ADDR: :8080
      SYNC_INTERVAL: 5m
      DATA_ADMIN_PASSWORD: ${DATA_ADMIN_PASSWORD:-}
      # Optional: raises GitHub's server-side API allowance.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
