services:
  - type: web
    name: open-bin-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DATA_ADMIN_PASSWORD
        sync: false
      # Optional: public website community links.
      - key: TELEGRAM_CHANNEL_URL
        sync: false
      - key: TELEGRAM_PRIVATE_URL
        sync: false
      - key: DEVELOPER_TELEGRAM_URL
        sync: false
